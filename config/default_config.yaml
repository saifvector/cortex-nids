# Network Intrusion Detection System (NIDS) Configuration

project:
  name: "Machine Learning-Based Network Intrusion Detection System"
  version: "1.0.0"
  random_state: 42
  debug: true

paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  external_data_dir: "data/external"
  models_dir: "models"
  logs_dir: "logs"

logging:
  level: "INFO"
  console_output: true
  file_output: true
  log_filename: "nids_execution.log"
  max_bytes: 10485760 # 10MB
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - [%(filename)s:%(lineno)d] - %(message)s"

data_preparation:
  target_column: "label"
  test_size: 0.2
  val_size: 0.1
  stratify: true
  scaling_method: "standard" # minmax, standard, robust
  imputation_strategy: "median" # mean, median, most_frequent

features:
  # Columns to drop during preprocessing (e.g., IDs, timestamps, constant columns)
  columns_to_drop:
    - "id"
    - "timestamp"
  # Target labels mapping (normal vs malicious categories)
  label_mapping:
    normal: 0
    intrusion: 1

model:
  selected_model: "random_forest"
  logistic_regression:
    c_value: 1.0
    solver: "lbfgs"
    max_iter: 100
  decision_tree:
    max_depth: 15
    min_samples_split: 5
  random_forest:
    n_estimators: 30
    max_depth: 15
    min_samples_split: 5
    n_jobs: -1
  extra_trees:
    n_estimators: 30
    max_depth: 15
    min_samples_split: 5
    n_jobs: -1
  xgboost:
    n_estimators: 50
    learning_rate: 0.1
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    n_jobs: -1
  lightgbm:
    n_estimators: 50
    learning_rate: 0.1
    max_depth: 6
    num_leaves: 31
    n_jobs: -1
  catboost:
    iterations: 50
    learning_rate: 0.1
    depth: 6
    thread_count: -1
    verbose: 0

evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1_score"
    - "roc_auc"

preprocessing:
  scaling_method: "standard" # standard, minmax, robust
  variance_threshold: 0.0001
  correlation_threshold: 0.90
  top_n_mi: 20
  top_n_rfe: 20
  balancing_method: "none" # none, smote, rus, class_weights
  test_size: 0.2
  random_state: 42

tuning:
  method: "randomized" # randomized, grid
  cv_folds: 5
  n_iter: 5
  optimization_sample_size: 50000
