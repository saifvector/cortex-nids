<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NIDS Automated QA Test Report</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; }
        .card { background: #1e293b; border-radius: 12px; padding: 2rem; max-width: 800px; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; }
        .pass { color: #4ade80; font-weight: bold; }
        .fail { color: #f87171; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🛡️ NIDS QA & Test Execution Report</h1>
        <p><strong>Date:</strong> 2026-08-10 21:47:40</p>
        <p><strong>Status:</strong> <span class="pass">ALL PASSED</span></p>

        <table>
            <tr><th>Metric</th><th>Value</th></tr>
            <tr><td>Total Tests</td><td>70</td></tr>
            <tr><td>Passed Tests</td><td class="pass">70</td></tr>
            <tr><td>Failed Tests</td><td class="fail">0</td></tr>
            <tr><td>Pass Rate</td><td>100.0%</td></tr>
            <tr><td>Duration</td><td>16.34s</td></tr>
        </table>
    </div>
</body>
</html>
