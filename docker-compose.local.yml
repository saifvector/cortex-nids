services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: cortex_nids_backend
    restart: always
    environment:
      - PORT=8000
      - JWT_SECRET_KEY=cortex_super_secret_jwt_key_998877665544332211_xdr
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=AdminPassword123!
    ports:
      - "8000:8000"
    volumes:
      - predictions_data:/app/predictions
      - models_data:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - nids_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: cortex_nids_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - nids_network

volumes:
  predictions_data:
  models_data:

networks:
  nids_network:
    driver: bridge
